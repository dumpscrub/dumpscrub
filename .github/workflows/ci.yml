name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest tests/ -q
